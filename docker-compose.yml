# ╔══════════════════════════════════════════════════════════════╗
# ║         IoT Dashboard - Docker Compose Configuration         ║
# ║                                                              ║
# ║  Data Flow:                                                  ║
# ║  [MC/ESP32] ──MQTT──> [Broker ${MQTT_BROKER_HOST}:1883]     ║
# ║       └──> [Telegraf] ──> [Prometheus] ──> [Grafana]        ║
# ║                                                              ║
# ║  Management:                                                 ║
# ║  [Web Dashboard (Nginx)] <──> [API (FastAPI/SQLite)]        ║
# ║  [Web Dashboard] ──iframe──> [Grafana via /grafana/]         ║
# ╚══════════════════════════════════════════════════════════════╝

services:

  # ─────────────────────────────────────────────
  # METRICS STORAGE
  # Scrape Telegraf metrics every 5s
  # ─────────────────────────────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    restart: always
    ports:
      - "9090:9090"
    volumes:
      - ./prometheus:/etc/prometheus
      - prometheus_data:/prometheus
    networks:
      - iot_network
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9090/-/ready"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 10s

  # ─────────────────────────────────────────────
  # MQTT BRIDGE
  # Subscribe ke MQTT broker, parse JSON, export metrics untuk Prometheus
  # MQTT broker dikonfigurasi via env var MQTT_BROKER_HOST
  # ─────────────────────────────────────────────
  telegraf:
    image: telegraf:1.29
    container_name: telegraf
    restart: unless-stopped
    ports:
      - "9273:9273"
    volumes:
      - ./telegraf/telegraf.conf:/etc/telegraf/telegraf.conf:ro
    environment:
      # - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-10.109.25.97}
      - MQTT_BROKER_HOST=${MQTT_BROKER_HOST:-10.109.25.91}
      - MQTT_BROKER_PORT=${MQTT_BROKER_PORT:-1883}
    networks:
      - iot_network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:9273/metrics"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 15s

  # ─────────────────────────────────────────────
  # VISUALIZATION
  # Reads from Prometheus datasource
  # Accessible at: http://localhost:3000 (direct)
  #            and http://localhost/grafana/ (via Nginx proxy)
  # ─────────────────────────────────────────────
  grafana:
    image: grafana/grafana:10.4.0
    container_name: grafana
    restart: always
    ports:
      - "3000:3000"
    volumes:
      - grafana_data:/var/lib/grafana
      - ./grafana/provisioning:/etc/grafana/provisioning
      - ./grafana/dashboards:/var/lib/grafana/dashboards
    environment:
      - GF_SECURITY_ADMIN_USER=${GF_SECURITY_ADMIN_USER:-admin}
      - GF_SECURITY_ADMIN_PASSWORD=${GF_SECURITY_ADMIN_PASSWORD:-adminpassword}
      # Allow embedding in iframes (for Web Dashboard integration)
      - GF_SECURITY_ALLOW_EMBEDDING=true
      # Anonymous access for viewing dashboards without login prompt
      - GF_AUTH_ANONYMOUS_ENABLED=true
      - GF_AUTH_ANONYMOUS_ORG_ROLE=Viewer
      # Root URL for correct asset loading via Nginx proxy
      - GF_SERVER_ROOT_URL=%(protocol)s://%(domain)s/grafana/
      - GF_SERVER_SERVE_FROM_SUB_PATH=true
      # Plugin for JSON datasource
      - GF_INSTALL_PLUGINS=marcusolsson-json-datasource
    networks:
      - iot_network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://localhost:3000/api/health"]
      interval: 15s
      timeout: 5s
      retries: 3
      start_period: 20s

  # ─────────────────────────────────────────────
  # DEVICE MANAGEMENT API
  # FastAPI + SQLite
  # Menyimpan: MAC Address → Name, MCID, Location, Model
  # Accessible via Nginx proxy at: /api/
  # ─────────────────────────────────────────────
  api:
    build: ./api
    container_name: device_mapping_api
    restart: always
    ports:
      - "${IOT_API_PORT:-8002}:8000"
    volumes:
      # Persist SQLite database outside the container
      - ./api/data:/app/data
      - ./api:/app/api
    environment:
      - PROMETHEUS_URL=http://prometheus:9090
      - ONLINE_THRESHOLD_MINUTES=${ONLINE_THRESHOLD_MINUTES:-5}
      - PAP_API_URL=${PAP_API_URL:-http://192.168.25.101:8000}
      - PAP_API_KEY=${PAP_API_KEY:-pap_key_iot_dashboard_default_secret_key_2026}
    extra_hosts:
      - "host.docker.internal:host-gateway"
    networks:
      - iot_network
    depends_on:
      prometheus:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health', timeout=3)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 30s

  # ─────────────────────────────────────────────
  # WEB DASHBOARD (HUB)
  # Nginx serves static files + reverse proxy:
  #   /        → Web UI (Device management)
  #   /api/    → api:8000 (FastAPI)
  #   /grafana/ → grafana:3000 (Grafana)
  # ─────────────────────────────────────────────
  web:
    image: nginx:alpine
    container_name: iot_dashboard_web
    restart: always
    ports:
      - "${IOT_WEB_PORT:-8088}:80"
    volumes:
      - ./web:/usr/share/nginx/html:ro
      - ./web/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    networks:
      - iot_network
    depends_on:
      api:
        condition: service_healthy
      grafana:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "--quiet", "--tries=1", "--spider", "http://127.0.0.1/"]
      interval: 15s
      timeout: 5s
      retries: 3

# ─────────────────────────────────────────────
# NAMED VOLUMES - persist data across restarts
# ─────────────────────────────────────────────
volumes:
  prometheus_data:
  grafana_data:

# ─────────────────────────────────────────────
# INTERNAL NETWORK
# Semua container berkomunikasi via 'iot_network'
# menggunakan service name sebagai hostname
# ─────────────────────────────────────────────
networks:
  iot_network:
    driver: bridge
